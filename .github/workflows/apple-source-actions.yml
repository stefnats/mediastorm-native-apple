# Test-branch-only replacement of the already registered workflow; do not merge into the baseline branch.
name: Apple synthetic iPhone playback smoke

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed 40-character smoke-branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-playback-smoke
  cancel-in-progress: false

jobs:
  iphone-playback-smoke:
    if: ${{ github.repository == 'stefnats/mediastorm-native-apple' && github.event.repository.private == false && github.ref == 'refs/heads/test/apple-playback-smoke' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SOURCE_REF: ${{ inputs.source_ref }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the reviewed immutable branch head
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 2
          persist-credentials: false
      - name: Run the actual original iPhone driver against the synthetic fixture
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 TestSupport/apple-ui-smoke/run-ci.py --output "$GITHUB_WORKSPACE/artifacts/iphone-playback-smoke"
      - name: Preserve actual UI, process and XCTest evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: apple-iphone-playback-smoke-${{ inputs.source_ref }}
          path: artifacts/iphone-playback-smoke/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
