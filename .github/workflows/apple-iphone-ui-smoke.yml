# Manual-only iPhone suites; preserve the original unit workflow and existing TV workflow.
name: Apple reusable synthetic iPhone UI smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Reviewed synthetic iPhone UI suite
        type: choice
        required: true
        default: basic
        options: [basic, profile, media]
      source_ref:
        description: Exact reviewed 40-character suite-branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-ui-smoke-iphone
  cancel-in-progress: false

jobs:
  iphone-ui-smoke:
    if: ${{ github.repository == 'stefnats/mediastorm-native-apple' && github.event.repository.private == false && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/test/apple-ui-suite') }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SOURCE_REF: ${{ inputs.source_ref }}
      SUITE: ${{ inputs.suite }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the reviewed immutable branch head and explicit suite
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == "$GITHUB_SHA" ]]
          case "$SUITE" in basic|profile|media) ;; *) exit 1 ;; esac
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 2
          persist-credentials: false
      - name: Run the original iPhone driver and selected synthetic controller
        run: |
          set -euo pipefail
          case "$SUITE" in
            basic) runner=TestSupport/apple-ui-smoke/basic/run-ci.py ;;
            profile) runner=TestSupport/apple-ui-smoke/profile/run-ci.py ;;
            media) runner=TestSupport/apple-ui-smoke/media/run-ci.py ;;
            *) exit 1 ;;
          esac
          mkdir -p artifacts
          python3 "$runner" --output "$GITHUB_WORKSPACE/artifacts/iphone-$SUITE-ui-smoke"
      - name: Preserve actual UI, process and XCTest evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: apple-iphone-${{ inputs.suite }}-ui-smoke-${{ inputs.source_ref }}
          path: artifacts/iphone-${{ inputs.suite }}-ui-smoke/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
