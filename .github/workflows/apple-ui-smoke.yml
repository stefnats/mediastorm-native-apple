# Manual UI workflow; preserve the separate original source-action unit workflow.
name: Apple reusable synthetic UI smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Reviewed synthetic UI suite
        type: choice
        required: true
        default: tvos
        options: [tvos]
      source_ref:
        description: Exact reviewed 40-character smoke-branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-ui-smoke-tvos
  cancel-in-progress: false

jobs:
  tvos-ui-smoke:
    if: ${{ github.repository == 'stefnats/mediastorm-native-apple' && github.event.repository.private == false && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/test/apple-ui-suite') && inputs.suite == 'tvos' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SOURCE_REF: ${{ inputs.source_ref }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the reviewed immutable branch head
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 2
          persist-credentials: false
      - name: Run the actual original tvOS remote driver against the synthetic fixture
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 TestSupport/apple-ui-smoke/tvos/run-ci.py --output "$GITHUB_WORKSPACE/artifacts/tvos-ui-smoke"
      - name: Preserve actual UI, process and XCTest evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: apple-tvos-ui-smoke-${{ inputs.source_ref }}
          path: artifacts/tvos-ui-smoke/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
